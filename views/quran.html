<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>القرآن حسب حالتك - فقاعات</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:"Amiri","Scheherazade New","Cairo",serif;background:linear-gradient(#f2fff7,#ffffff);display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden;transition: background 1s;position: relative;}
body.dim{background: radial-gradient(circle, #0f1f14, #000);}
#canvas-bubbles{position:fixed;top:0; left:0;width:100%;height:100%;z-index:0;}
.app{background: rgba(255,255,255,0.7);backdrop-filter: blur(15px);-webkit-backdrop-filter: blur(15px);width:90%;max-width:400px;padding:20px;border-radius:25px;box-shadow:0 10px 30px rgba(0,0,0,0.15);text-align:center;}
h1{color:#1b5e20;font-size:28px;margin-bottom:5px;}
h2{font-size:16px;color:#555;margin-bottom:15px;}
.moods{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
.moods button,.controls button{padding:12px;border:none;border-radius:16px;font-size:14px;cursor:pointer;font-weight:bold;background: rgba(255,255,255,0.6);backdrop-filter: blur(10px);box-shadow: 0 4px 15px rgba(0,0,0,0.1);transition: all 0.25s ease;position: relative;overflow: hidden;}
.result{display:none;margin-top:15px;}
.ayah-box{position:relative;padding:20px;border-radius:20px;background:rgba(255,255,255,0.6);backdrop-filter: blur(10px);box-shadow:0 0 20px rgba(46,125,50,0.2);}
#ayah{font-size:26px;line-height:2.2;white-space: pre-wrap;text-align:center;font-weight:bold;margin-bottom:5px;direction: rtl;unicode-bidi: plaintext;}
.controls button{margin:5px;padding:8px 12px;border:none;border-radius:10px;background:#2e7d32;color:white;cursor:pointer;transition: all 0.3s;}
.controls button:hover{background:#43a047;}
</style>
</head>
<body>
<canvas id="canvas-bubbles"></canvas>
<div class="app">
<h1>📖 القرآن لك</h1>
<h2>كيف تشعر اليوم؟</h2>
<div class="moods" id="moods">
<button onclick="toggleDark()">🌙زر الوضع الليلي</button>
<button onclick="chooseMood('sad')">😔 حزين</button>
<button onclick="chooseMood('fear')">😟 قلق</button>
<button onclick="chooseMood('angry')">😡 غاضب</button>
<button onclick="chooseMood('dua')">🙏 دعاء</button>
<button onclick="chooseMood('repent')">🌱 توبة</button>
<button onclick="chooseMood('patience')">💪 صبر</button>
<button onclick="chooseMood('hope')">🌟 أمل</button>
</div>
<div class="result" id="result">
<div class="ayah-box" id="ayahBox"><div id="ayah"></div></div>
<div class="meaning" id="meaning"></div>
<div class="action" id="action"></div>
<div class="controls">
<button onclick="newAyah()">🔄 آية أخرى</button>
<button onclick="playAudio()">🎧 استماع</button>
<button onclick="playFullSurah()">🎵 السورة كاملة</button>
<button onclick="goBack()">🔙 رجوع</button>
</div>
<audio id="audio"></audio>
</div>
</div>
<script>
const moods={sad:[2,286,153],fear:[3,173,40],angry:[5,134,37],dua:[1,60,186],repent:[53,222,8],patience:[155,200,10],hope:[13,19,24]};
let currentMood="";
let currentSurah=1;
let lastAyah=null;
function toggleDark(){document.body.classList.toggle("dim");}
async function getAyah(num){
const url="https://api.alquran.cloud/v1/ayah/"+num+"/ar.abdulsamad";
const res=await fetch(url);
const data=await res.json();
const text=data.data.text.replace(/^\ufeff/,"");
document.getElementById("ayah").innerText="﴿ "+text+" ﴾";
document.getElementById("meaning").innerText="📖 "+data.data.surah.name+" - آية "+data.data.numberInSurah;
document.getElementById("action").innerText="🎯 استمع وتدبّر هذه الآية";
document.getElementById("audio").src=data.data.audio;
currentSurah=data.data.surah.number;
lastAyah=num;
}
function chooseMood(mood,skipRandom=false){currentMood=mood;document.getElementById("moods").style.display="none";document.getElementById("result").style.display="block";newAyah();}
function newAyah(){const list=moods[currentMood];const randomIndex=Math.floor(Math.random()*list.length);getAyah(list[randomIndex]);}
function goBack(){currentMood="";document.getElementById("result").style.display="none";document.getElementById("moods").style.display="grid";}
function playAudio(){const audio=document.getElementById("audio");audio.play();}
async function playFullSurah(){
const audio=document.getElementById("audio");
const res=await fetch("https://api.alquran.cloud/v1/surah/"+currentSurah+"/ar.abdulsamad");
const data=await res.json();
if(data.data.audio){
audio.src=data.data.audio;
audio.play();
}else if(data.data.ayahs && data.data.ayahs.length>0){
let index=0;
function playNext(){
if(index>=data.data.ayahs.length) return;
audio.src=data.data.ayahs[index].audio;
audio.play();
audio.onended=()=>{index++;playNext();};
}
playNext();
}
}
</script>
</body>
</html>
