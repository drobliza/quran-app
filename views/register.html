<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إنشاء حساب</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:"Amiri",serif;background:linear-gradient(#e8f5e9,#fff);display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden}
canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0}
.register-box{background:#fff;padding:30px 25px;border-radius:20px;width:90%;max-width:350px;box-shadow:0 0 20px rgba(46,125,50,.2);text-align:center;z-index:1}
.register-box h1{color:#2e7d32}
input{width:100%;padding:12px;margin-bottom:12px;border-radius:12px;border:1px solid #c8e6c9;font-size:15px;box-sizing:border-box}
button{width:100%;padding:12px;border:0;border-radius:12px;background:#2e7d32;color:#fff;font-size:16px;cursor:pointer}button:hover{background:#43a047}button:disabled{opacity:.6;cursor:not-allowed}
.message{padding:10px;border-radius:10px;margin-bottom:12px}.error{background:#ffebee;color:#c62828;display:none}
a{display:block;margin-top:15px;color:#2e7d32;text-decoration:none}
.hint{font-size:13px;color:#666;margin:-4px 0 12px}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div class="register-box">
  <h1>✨ إنشاء حساب</h1>
  <div class="message error" id="errorBox"></div>
  <form method="POST" action="/register" id="registerForm">
    <input type="hidden" name="csrfToken" id="csrfToken">
    <input type="text" name="username" placeholder="اسم المستخدم" autocomplete="username" maxlength="30" required>
    <input type="password" name="password" placeholder="كلمة المرور" autocomplete="new-password" minlength="8" maxlength="128" required>
    <div class="hint">كلمة المرور: 8 أحرف على الأقل</div>
    <button type="submit" id="submitButton" disabled>إنشاء الحساب</button>
  </form>
  <a href="/">لديك حساب بالفعل؟ تسجيل الدخول</a>
</div>
<script>
const params=new URLSearchParams(window.location.search),errorBox=document.getElementById("errorBox");
const errors={exists:"❌ اسم المستخدم مستخدم بالفعل",invalid_username:"❌ اسم المستخدم غير صالح",weak_password:"❌ كلمة المرور يجب أن تكون بين 8 و128 حرفًا"};
if(errors[params.get("error")]){errorBox.textContent=errors[params.get("error")];errorBox.style.display="block";}
fetch("/login-token",{credentials:"same-origin"}).then(r=>r.json()).then(data=>{document.getElementById("csrfToken").value=data.csrfToken;document.getElementById("submitButton").disabled=false;}).catch(()=>{errorBox.textContent="❌ تعذر تجهيز نموذج التسجيل. أعد تحميل الصفحة.";errorBox.style.display="block";});
const canvas=document.getElementById("bg"),ctx=canvas.getContext("2d");let W=canvas.width=innerWidth,H=canvas.height=innerHeight;
window.onresize=()=>{W=canvas.width=innerWidth;H=canvas.height=innerHeight};let bubbles=[];for(let i=0;i<40;i++)bubbles.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*8+3,v:Math.random()*.5+.2});
function animate(){ctx.clearRect(0,0,W,H);ctx.fillStyle="rgba(46,125,50,.2)";for(const b of bubbles){ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();b.y-=b.v;if(b.y<0)b.y=H}requestAnimationFrame(animate)}animate();
</script>
</body>
</html>
