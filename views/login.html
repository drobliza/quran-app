<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:"Amiri", serif;
  background:linear-gradient(#e8f5e9,#ffffff);
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  overflow:hidden;
}

canvas{
  position:fixed;
  top:0; left:0;
  width:100%;
  height:100%;
  z-index:0;
}

.login-box{
  background:white;
  padding:30px 25px;
  border-radius:20px;
  width:90%;
  max-width:350px;
  box-shadow:0 0 20px rgba(46,125,50,0.2);
  text-align:center;
  animation: fadeIn 1s ease;
  z-index:1;
}

@keyframes fadeIn{
  from{opacity:0; transform:translateY(20px);}
  to{opacity:1; transform:translateY(0);}
}

.login-box h1{color:#2e7d32;}
.login-box p{font-size:14px;color:#555;margin-bottom:15px;}

input{
  width:100%;
  padding:12px;
  margin-bottom:12px;
  border-radius:12px;
  border:1px solid #c8e6c9;
  font-size:15px;
  box-sizing:border-box;
}

button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:12px;
  background:#2e7d32;
  color:white;
  font-size:16px;
  cursor:pointer;
  transition:0.3s;
}

button:hover{background:#43a047;}

.error{
  background:#ffebee;
  color:#c62828;
  padding:10px;
  border-radius:10px;
  margin-bottom:12px;
  display:none;
  animation: shake 0.3s;
}

.success{
  background:#e8f5e9;
  color:#2e7d32;
  padding:10px;
  border-radius:10px;
  margin-bottom:12px;
  display:none;
}

@keyframes shake{
  0%{transform:translateX(0);}
  25%{transform:translateX(5px);}
  50%{transform:translateX(-5px);}
  75%{transform:translateX(5px);}
  100%{transform:translateX(0);}
}

a{
  display:block;
  margin-top:15px;
  color:#2e7d32;
  text-decoration:none;
}
</style>
</head>

<body>

<canvas id="bg"></canvas>

<div class="login-box">
  <h1>📖 مرحبًا بك</h1>
  <p>سجّل دخولك للوصول إلى القرآن حسب حالتك</p>

  <div class="error" id="errorBox">❌ اسم المستخدم أو كلمة المرور غير صحيحة</div>
  <div class="success" id="successBox">✅ تم إنشاء الحساب بنجاح</div>

  <form method="POST" action="/login">
    <input type="text" name="username" placeholder="اسم المستخدم" required>
    <input type="password" name="password" placeholder="كلمة المرور" required>
    <button type="submit">تسجيل الدخول</button>
  </form>

  <a href="/register">إنشاء حساب جديد</a>
</div>

<script>
const params = new URLSearchParams(window.location.search);

if(params.get("error")){
  document.getElementById("errorBox").style.display="block";
}

if(params.get("registered")){
  document.getElementById("successBox").style.display="block";
}

const canvas = document.getElementById("bg");
const ctx = canvas.getContext("2d");
let W = canvas.width = window.innerWidth;
let H = canvas.height = window.innerHeight;

window.onresize=()=>{W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;}

let bubbles=[];
for(let i=0;i<40;i++){
  bubbles.push({
    x:Math.random()*W,
    y:Math.random()*H,
    r:Math.random()*8+3,
    v:Math.random()*0.5+0.2
  });
}

function animate(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle="rgba(46,125,50,0.2)";
  for(let b of bubbles){
    ctx.beginPath();
    ctx.arc(b.x,b.y,b.r,0,Math.PI*2);
    ctx.fill();
    b.y-=b.v;
    if(b.y<0){b.y=H;}
  }
  requestAnimationFrame(animate);
}
animate();
</script>

</body>
</html>
